name: Daily Digest

on:
  schedule:
    # 08:57 UTC, Mon-Fri. GitHub Actions cron is UTC only — adjust for your local time.
    # For 09:00 BST (UTC+1): 0 8 * * 1-5. For 09:00 GMT: 0 9 * * 1-5.
    - cron: "57 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run digest
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_USER_ID: ${{ vars.RECIPIENT_USER_ID }}
        run: npm run digest
