display_information:
  name: PDE Digest
  description: Posts a daily summary of recent activity across PDE team Slack channels.
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: PDE Digest
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      - users:read
      - im:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
